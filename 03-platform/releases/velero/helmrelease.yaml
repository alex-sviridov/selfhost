# helmrelease.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: velero
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: vmware-tanzu
  namespace: velero
spec:
  url: https://vmware-tanzu.github.io/helm-charts
  interval: 24h
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: velero
  namespace: velero
spec:
  interval: 30m
  chart:
    spec:
      chart: velero
      version: "12.2.0"
      sourceRef:
        kind: HelmRepository
        name: vmware-tanzu
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  valuesFrom:
    - kind: Secret
      name: velero-s3-credentials
      valuesKey: values.yaml
  values:
    image:
      repository: docker.io/velero/velero
      tag: v1.18.2
      pullPolicy: IfNotPresent

    initContainers:
      - name: velero-plugin-for-aws
        image: velero/velero-plugin-for-aws:v1.14.1
        imagePullPolicy: IfNotPresent
        volumeMounts:
          - mountPath: /target
            name: plugins

    credentials:
      useSecret: true
      existingSecret: velero-s3-credentials

    configuration:
      uploaderType: kopia
      fsBackupTimeout: 4h
      defaultBackupTTL: 720h
      defaultVolumesToFsBackup: false

    snapshotsEnabled: false
    deployNodeAgent: true

    nodeAgent:
      podSecurityContext:
        runAsUser: 0
      resources:
        requests:
          cpu: 250m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi

    schedules:
      daily:
        schedule: "11 5 * * *"
        template:
          includedNamespaces:
            - "*"
          excludedNamespaces:
            - cert-manager
            - default
            - external-dns
            - flux-system
            - kube-*
            - oauth2-proxy
            - traefik-system
            - velero
          includedResources:
            - "*"
          excludedResources:
            - storageclasses.storage.k8s.io