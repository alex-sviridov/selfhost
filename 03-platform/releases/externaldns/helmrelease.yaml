apiVersion: v1
kind: Namespace
metadata:
  name: external-dns
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: external-dns
  namespace: external-dns
spec:
  url: https://kubernetes-sigs.github.io/external-dns
  interval: 24h
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: externaldns
  namespace: external-dns
spec:
  interval: 30m
  dependsOn:
    - name: traefik
      namespace: traefik-system
  chart:
    spec:
      chart: external-dns
      version: "1.22.0"
      sourceRef:
        kind: HelmRepository
        name: external-dns
  values:
    provider:
      name: cloudflare
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: external-dns-secrets
            key: cloudflare_token
    sources:
      - traefik-proxy
    domainFilters:
      - "${DNS_ZONE_NAME}"
    extraArgs:
      - --cloudflare-proxied
    policy: sync
    registry: txt
    txtOwnerId: selfhost-cluster