apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana
  namespace: monitoring
spec:
  interval: 1h
  url: https://grafana.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-cloud
  namespace: monitoring
spec:
  dependsOn:
    - name: prometheus-operator-crds
      namespace: monitoring
  interval: 30m
  releaseName: grafana-cloud      # keep: sdkInjector references the grafana-cloud-alloy service account
  targetNamespace: monitoring
  chart:
    spec:
      chart: k8s-monitoring
      version: "4.6.0"            # pin the exact version, see below
      sourceRef:
        kind: HelmRepository
        name: grafana
  install:
    remediation: { retries: 3 }
  upgrade:
    remediation: { retries: 3 }
        
  values:
    cluster:
      name: selfhost

    destinations:
      grafana-cloud-metrics:
        type: prometheus
        url: https://prometheus-prod-24-prod-eu-west-2.grafana.net/api/prom/push
        auth:
          type: basic
          usernameKey: prometheus-id
          passwordKey: token
        secret:
          create: false
          name: grafanacloud-secret
          namespace: monitoring
      grafana-cloud-logs:
        type: loki
        url: https://logs-prod-012.grafana.net/loki/api/v1/push
        auth:
          type: basic
          usernameKey: loki-id
          passwordKey: token
        secret:
          create: false
          name: grafanacloud-secret
          namespace: monitoring

    clusterMetrics:
      enabled: true
      collector: alloy-metrics
    hostMetrics:
      enabled: true
      collector: alloy-metrics
      linuxHosts:
        enabled: true
        namespace: monitoring
        labelMatchers:
          app.kubernetes.io/name: node-exporter
    clusterEvents:
      enabled: true
      collector: alloy-singleton
    podLogsViaLoki:
      enabled: true
      collector: alloy-logs

    collectors:
      alloy-metrics:
        presets: [clustered, statefulset]
        alloy:
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { memory: 512Mi }
      alloy-singleton:
        presets: [singleton]
      alloy-logs:
        presets: [filesystem-log-reader, daemonset]
        alloy:
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { memory: 512Mi }

    telemetryServices:
      node-exporter:
        deploy: true
      kube-state-metrics:
        deploy: true
      beyla:
        deploy: false
      opencost:
        deploy: false
      sdkInjector:
        deploy: false

