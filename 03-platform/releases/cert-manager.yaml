apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
---
# cert-manager
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: jetstack
  namespace: cert-manager
spec:
  url: https://charts.jetstack.io
  interval: 24h
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 30m
  chart:
    spec:
      chart: cert-manager
      version: "1.21"
      sourceRef:
        kind: HelmRepository
        name: jetstack
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    crds:
      enabled: true
---
# Cloudflare Origin CA issuer: CRDs (not shipped in the chart)
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: origin-ca-issuer
  namespace: cert-manager
spec:
  url: https://github.com/cloudflare/origin-ca-issuer
  ref:
    tag: v0.15.0    # check the exact tag name on the repo's tags page
  interval: 24h
  ignore: |
    /*
    !/deploy/crds/
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: origin-ca-issuer-crds
  namespace: cert-manager
spec:
  path: ./deploy/crds
  sourceRef:
    kind: GitRepository
    name: origin-ca-issuer
  interval: 1h
  prune: false
---
# Cloudflare Origin CA issuer: controller
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: origin-ca-issuer
  namespace: cert-manager
spec:
  url: oci://ghcr.io/cloudflare/origin-ca-issuer-charts/origin-ca-issuer
  ref:
    tag: "0.6.10"
  interval: 24h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: origin-ca-issuer
  namespace: cert-manager
spec:
  interval: 30m
  dependsOn:
    - name: cert-manager
  chartRef:
    kind: OCIRepository
    name: origin-ca-issuer
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3