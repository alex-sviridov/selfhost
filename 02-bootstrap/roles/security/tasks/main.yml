---
- name: Install security packages
  ansible.builtin.dnf:
    name:
      - firewalld
      - dnf-automatic
    state: present

- name: Ensure firewalld is running and enabled
  ansible.builtin.systemd:
    name: firewalld
    state: started
    enabled: true

- name: Public zone allows only HTTP/HTTPS
  ansible.builtin.copy:
    dest: /etc/firewalld/zones/public.xml
    mode: '0644'
    content: |
      <?xml version="1.0" encoding="utf-8"?>
      <zone>
        <short>Public</short>
        <port protocol="tcp" port="80"/>
        <port protocol="tcp" port="443"/>
      </zone>
  notify: Reload firewalld

- name: Trusted zone for private, k3s and Tailscale traffic
  ansible.builtin.copy:
    dest: /etc/firewalld/zones/trusted.xml
    mode: '0644'
    content: |
      <?xml version="1.0" encoding="utf-8"?>
      <zone target="ACCEPT">
        <short>Trusted</short>
        <interface name="tailscale0"/>
        <source address="10.0.0.0/16"/>
        <source address="10.42.0.0/16"/>
        <source address="10.43.0.0/16"/>
      </zone>
  notify: Reload firewalld

- name: Apply SSH hardening config
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/99-hardening.conf
    owner: root
    group: root
    mode: '0600'
    validate: /usr/sbin/sshd -t -f %s
    content: |
      PasswordAuthentication no
      PermitEmptyPasswords no
      KbdInteractiveAuthentication no
      PermitRootLogin no
      MaxAuthTries 3
      LoginGraceTime 30
      AllowTcpForwarding yes
      X11Forwarding no
      AllowAgentForwarding no
      PermitUserEnvironment no
      KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org
      Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com
      MACs hmac-sha2-256-etm@openssh.com,hmac-sha2-512-etm@openssh.com
      ClientAliveInterval 300
      ClientAliveCountMax 2
      AllowUsers admin
  notify: Restart sshd

- name: Configure automatic security updates
  community.general.ini_file:
    path: /etc/dnf/automatic.conf
    section: commands
    option: "{{ item.key }}"
    value: "{{ item.value }}"
  loop:
    - { key: upgrade_type, value: security }
    - { key: apply_updates, value: "yes" }

- name: Enable automatic updates timer
  ansible.builtin.systemd:
    name: dnf-automatic.timer
    state: started
    enabled: true