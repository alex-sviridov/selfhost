{{- $appName := .Values.appName -}}
{{- range .Values.ingress }}
{{- if .stripPrefix }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $appName }}-{{ .path | replace "/" "-" | trimAll "-" }}-stripprefix
  labels:
    app.kubernetes.io/name: {{ $appName }}
spec:
  stripPrefix:
    prefixes:
      - {{ .path }}
{{- end }}
{{- end }}