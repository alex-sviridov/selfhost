{{- if .Values.ingress }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ .Values.appName }}-ingressroute
  {{- if .Values.dnsTarget }}
  annotations:
    external-dns.kubernetes.io/target: {{ .Values.dnsTarget | quote }}
    external-dns.alpha.kubernetes.io/target: {{ .Values.dnsTarget | quote }}
  {{- end }}
spec:
  entryPoints:
    - websecure
  routes:
    {{- range $route := .Values.ingress }}
    - match: Host(`{{ $.Values.ingressHost }}`) && PathPrefix(`{{ $route.path }}`){{- if $route.extraMatch }} && {{ $route.extraMatch }}{{- end }}
      kind: Rule

      {{- if or $route.middlewares $route.stripPrefix }}
      middlewares:
        {{- if $route.stripPrefix }}
        - name: {{ $.Values.appName }}-{{ .path  }}-stripprefix
          namespace: {{ $.Release.Namespace }}
        {{- end }}

        {{- range $route.middlewares }}
        - name: {{ .name }}
          namespace: {{ .namespace | default $.Release.Namespace }}
        {{- end }}
      {{- end }}

      services:
        - name: {{ $.Values.appName }}-svc
          port: {{ $.Values.service.port }}
    {{- end }}
{{- end }}