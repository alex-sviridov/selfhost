{{- $appName := .Values.appName -}}
{{- range $name, $pvc := .Values.storage }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $appName }}-{{ $name }}-pvc
  labels:
    app.kubernetes.io/name: {{ $appName }}
spec:
  accessModes:
    - {{ $pvc.accessMode | default "ReadWriteOnce" }}
  resources:
    requests:
      storage: {{ $pvc.size }}
---
{{- end }}