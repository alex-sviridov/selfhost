apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.appName }}
  labels:
    app.kubernetes.io/name: {{ .Values.appName }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.appName }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.appName }}
    spec:
      containers:
        - name: {{ .Values.appName }}
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          ports:
            - containerPort: {{ .Values.service.port }}
              name: http
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"

          {{- if .Values.env }}
          env:
            {{- toYaml .Values.env | nindent 12 }}
          {{- end }}              

          {{- if .Values.storage }}
          volumeMounts:
            {{- range $name, $pvc := .Values.storage }}
            - name: {{ $name }}
              mountPath: {{ $pvc.mountPath }}
            {{- end }}
          {{- end }}            

      {{- if .Values.storage }}
      volumes:
        {{- range $name, $pvc := .Values.storage }}
        - name: {{ $name }}
          persistentVolumeClaim:
            claimName: {{ $.Values.appName }}-{{ $name }}-pvc
        {{- end }}
      {{- end }}