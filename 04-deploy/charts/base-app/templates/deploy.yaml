apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.appName }}
  labels:
    app.kubernetes.io/name: {{ .Values.appName }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.appName }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.appName }}
      {{- $backupVolumes := list }}
      {{- range $name, $pvc := .Values.storage }}
        {{- if not $pvc.noBackup }}
          {{- $backupVolumes = append $backupVolumes $name }}
        {{- end }}
      {{- end }}
      {{- if $backupVolumes }}
      annotations:
        backup.velero.io/backup-volumes: {{ join "," $backupVolumes }}
      {{- end }}
    spec:
      containers:
        - name: {{ .Values.appName }}
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          ports:
            - containerPort: {{ .Values.service.port }}
              name: http
          resources:
            requests:
              memory: {{ .Values.resources.requests.memory | default "128Mi" }}
              cpu: {{ .Values.resources.requests.cpu | default "50m" }}
            limits:
              memory: {{ .Values.resources.limits.memory | default "512Mi" }}
              cpu: {{ .Values.resources.limits.cpu | default "1" }}

          {{- if .Values.env }}
          env:
            {{- toYaml .Values.env | nindent 12 }}
          {{- end }}              

          {{- if .Values.storage }}
          volumeMounts:
            {{- range $name, $pvc := .Values.storage }}
            - name: {{ $name }}
              mountPath: {{ $pvc.mountPath }}
            {{- end }}
          {{- end }}            

          {{- if .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          {{- end }}          

      {{- if .Values.storage }}
      volumes:
        {{- range $name, $pvc := .Values.storage }}
        - name: {{ $name }}
          persistentVolumeClaim:
            claimName: {{ $.Values.appName }}-{{ $name }}-pvc
        {{- end }}
      {{- end }}