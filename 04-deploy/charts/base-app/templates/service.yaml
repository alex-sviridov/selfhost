{{- if .Values.service }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.appName }}-svc
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ .Values.appName }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
{{- end }}