apiVersion: v1
kind: Namespace
metadata:
  name: whoami
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: whoami
  namespace: whoami
spec:
  interval: 30m
  chartRef:
    kind: HelmChart
    name: base-app
    namespace: flux-system
  values:
    ingressHost: "${SERVICE_DNS_NAME}.${DNS_ZONE_NAME}"
    appName: whoami
    image:
      repository: traefik/whoami
      tag: v1.10
    service:
      port: 80

    ingress:
      - path: /whoami
        stripPrefix: true
        middlewares:
          - name: errors
            namespace: oauth2-proxy
          - name: auth
            namespace: oauth2-proxy 

    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "100m"