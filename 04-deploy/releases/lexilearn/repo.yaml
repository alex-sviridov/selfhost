apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: lexi-repo
  namespace: flux-system
spec:
  interval: 5m
  url: https://github.com/alex-sviridov/lexi
  ref:
    branch: main
  secretRef:
    name: lexi-repo-auth
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: lexi-repo
  namespace: flux-system
spec:
  interval: 5m
  path: ./deploy/
  prune: true
  sourceRef:
    kind: GitRepository
    name: lexi-repo
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: selfhost