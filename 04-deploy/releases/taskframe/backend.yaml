apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: taskframe-backend
  namespace: taskframe
spec:
  interval: 30m
  chartRef:
    kind: HelmChart
    name: base-app
    namespace: flux-system
  values:
    appName: taskframe-backend

    image:
      repository: ghcr.io/alex-sviridov/taskframe-pocketbase
      tag:  19a4457

    service:
      port: 8090

    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "100m"

    storage:
      data:
        mountPath: /pb/pb_data
        accessMode: ReadWriteOnce
        size: 100Mi
