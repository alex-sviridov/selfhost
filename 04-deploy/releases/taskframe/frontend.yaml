apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: taskframe-frontend
  namespace: taskframe
spec:
  dependsOn:
    - name: traefik
      namespace: traefik-system
  interval: 30m
  chartRef:
    kind: HelmChart
    name: base-app
    namespace: flux-system
  values:
    appName: taskframe-frontend

    image:
      repository: ghcr.io/alex-sviridov/taskframe
      tag: 19a4457

    service:
      port: 8080

    ingressHost: "${SERVICE_DNS_NAME}.${DNS_ZONE_NAME}"
    ingress:
      - path: /task
        stripPrefix: true

    env:
      - name: PB_UPSTREAM
        value: "taskframe-backend-svc:8090"

      - name: BASE_HREF
        value: "/task/"
      
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "100m"