apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: readtrail-backend
  namespace: readtrail
spec:
  interval: 30m
  chartRef:
    kind: HelmChart
    name: base-app
    namespace: flux-system
  values:
    appName: readtrail-backend

    image:
      repository: ghcr.io/alex-sviridov/readtrail/backend
      tag: sha-4cf3750

    service:
      port: 8090

    ingressHost: readtrail.net
    ingress:
    - path: /api/
      stripPrefix: false

    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "256Mi"
        cpu: "200m"

    storage:
      data:
        mountPath: /pb/pb_data
        accessMode: ReadWriteOnce
        size: 1Gi
