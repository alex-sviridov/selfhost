apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: readtrail-frontend
  namespace: readtrail
spec:
  dependsOn:
    - name: traefik
      namespace: traefik-system
  interval: 30m
  chartRef:
    kind: HelmChart
    name: base-app
    namespace: flux-system
  values:
    appName: readtrail-frontend

    image:
      repository: ghcr.io/alex-sviridov/readtrail/frontend
      tag: sha-4cf3750

    service:
      port: 8080

    ingressHost: readtrail.net

    ingress:
      - path: /

    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "256Mi"
        cpu: "200m"
