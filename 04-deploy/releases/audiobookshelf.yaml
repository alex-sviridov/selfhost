apiVersion: v1
kind: Namespace
metadata:
  name: audiobookshelf
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: audiobookshelf
  namespace: audiobookshelf
spec:
  dependsOn:
    - name: traefik
      namespace: traefik-system
  interval: 30m
  chartRef:
    kind: HelmChart
    name: base-app
    namespace: flux-system
  values:
    appName: audiobookshelf
    image:
      repository: ghcr.io/advplyr/audiobookshelf
      tag: 2.36.0
    service:
      port: 8080

    dnsTarget: "${SERVICE_DNS_NAME}.${DNS_ZONE_NAME}"
    ingressHost: "abs.${DNS_ZONE_NAME}"

    ingress:
      - path: /
        stripPrefix: true

    env:
      - name: TZ
        value: "Europe/Luxembourg"
      - name: HOST
        value: "0.0.0.0"
      - name: PORT
        value: "8080"
      - name: REFRESH_TOKEN_EXPIRY
        value: "4838400"

    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "512Mi"
        cpu: "200m"

    storage:
      config:
        mountPath: /config
        size: 100Mi
      metadata:
        mountPath: /metadata
        size: 100Mi
      audiobooks:
        mountPath: /audiobooks
        size: 10Gi
      podcasts:
        mountPath: /podcasts
        size: 1Gi