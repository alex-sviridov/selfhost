appName: whoami
image:
  repository: traefik/whoami
  tag: v1.10
service:
  port: 80

ingress:
  - path: /whoami
    stripPrefix: true
    middlewares:
      - name: errors
        namespace: oauth2-proxy
      - name: auth
        namespace: oauth2-proxy 

resources:
  requests:
    memory: "64Mi"
    cpu: "50m"
  limits:
    memory: "128Mi"
    cpu: "100m"