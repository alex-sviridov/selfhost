apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lexi-admin
  namespace: lexi
spec:
  interval: 30m
  chartRef:
    kind: HelmChart
    name: base-app
    namespace: flux-system
  values:
    appName: lexi-admin

    image:
      repository: sviridov12/lexi
      tag: adminui-sha-3d28a4621cce19977c3e1c2be8b5c46e26d6b04e

    service:
      port: 8080

    ingressHost: "lexi.${DNS_ZONE_NAME}"

    ingress:
      - path: /admin

    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "100m"
