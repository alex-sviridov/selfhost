apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lexi-admin
  namespace: lexi
spec:
  interval: 30m
  chartRef:
    kind: HelmChart
    name: base-app
    namespace: flux-system
  values:
    appName: lexi-admin

    image:
      repository: sviridov12/lexi
      tag: adminui-sha-3ed6c4d1784302b85d56be044b6a2e644848e508

    service:
      port: 8080

    ingressHost: "lexi.${DNS_ZONE_NAME}"

    ingress:
      - path: /admin

    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "100m"
