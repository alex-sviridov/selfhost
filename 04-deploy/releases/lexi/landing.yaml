apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lexi-landing
  namespace: lexi
spec:
  interval: 30m
  chartRef:
    kind: HelmChart
    name: base-app
    namespace: flux-system
  values:
    appName: lexi-landing

    image:
      repository: sviridov12/lexi
      tag: landing-0.7.3

    service:
      port: 8080

    ingressHost: "lexi.${DNS_ZONE_NAME}"

    ingress:
      - path: /landing

    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "100m"
