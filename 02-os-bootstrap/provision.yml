---
- name: 01. Prepare and harden Rocky Linux nodes
  hosts: k3s_cluster
  tags:
    - base
  roles:
    - common
    - node-history
    - security

- name: 02. Deploy K3s Cluster via official orchestration
  import_playbook: k3s.orchestration.site
  tags:
    - k3s

- name: 03. Fetch and configure local kubeconfig
  hosts: k3s_cluster
  run_once: true
  tags:
    - get-kubeconfig
  roles:
    - get-kubeconfig

- name: 04. Install basic platform conponents
  hosts: localhost
  connection: local
  gather_facts: false
  module_defaults:
    group/kubernetes.core.k8s:
      kubeconfig: "{{ kubeconfig_path }}"
  roles:
    - platform
  tags:
    - platform

- name: 05. Install Flux CD
  hosts: localhost
  connection: local
  gather_facts: false
  module_defaults:
    group/kubernetes.core.k8s:
      kubeconfig: "{{ kubeconfig_path }}"
  roles:
    - flux
  tags: [flux]    